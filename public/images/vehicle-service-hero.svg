<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="carGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <linearGradient id="metallic" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Workshop Wall -->
  <rect width="1200" height="800" fill="url(#bgGrad)"/>

  <!-- Grid Lines / Modern Workshop Panel Style -->
  <g stroke="#334155" stroke-width="1" opacity="0.4">
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
    <line x1="300" y1="0" x2="300" y2="800"/>
    <line x1="600" y1="0" x2="600" y2="800"/>
    <line x1="900" y1="0" x2="900" y2="800"/>
  </g>

  <!-- Workshop Floor -->
  <polygon points="0,620 1200,620 1200,800 0,800" fill="#1e293b"/>
  <line x1="0" y1="620" x2="1200" y2="620" stroke="#3b82f6" stroke-width="4" opacity="0.6"/>

  <!-- Safety Floor Markings -->
  <g stroke="#f59e0b" stroke-width="6" stroke-dasharray="25 15" opacity="0.4">
    <line x1="150" y1="650" x2="1050" y2="650"/>
  </g>

  <!-- Hydraulic Lift Columns -->
  <rect x="260" y="220" width="50" height="420" rx="6" fill="url(#metallic)"/>
  <rect x="890" y="220" width="50" height="420" rx="6" fill="url(#metallic)"/>
  
  <!-- Lift Arms -->
  <rect x="290" y="440" width="160" height="24" rx="4" fill="#64748b"/>
  <rect x="750" y="440" width="160" height="24" rx="4" fill="#64748b"/>

  <!-- Car Silhouette & Body (Elevated on Lift) -->
  <g transform="translate(300, 240)">
    <!-- Car Shadow -->
    <ellipse cx="300" cy="230" rx="340" ry="25" fill="#020617" opacity="0.6"/>
    
    <!-- Wheels -->
    <circle cx="120" cy="180" r="55" fill="#0f172a" stroke="#475569" stroke-width="10"/>
    <circle cx="120" cy="180" r="25" fill="#94a3b8"/>
    <circle cx="480" cy="180" r="55" fill="#0f172a" stroke="#475569" stroke-width="10"/>
    <circle cx="480" cy="180" r="25" fill="#94a3b8"/>

    <!-- Car Body -->
    <path d="M 40,160 
             C 60,110 130,90 200,80 
             L 280,30 
             C 330,20 420,20 470,40 
             L 530,90 
             C 570,100 590,130 600,160 
             Z" fill="url(#carGrad)"/>

    <!-- Roof & Windows -->
    <path d="M 210,80 L 285,35 C 330,25 410,25 455,42 L 505,80 Z" fill="#020617" opacity="0.75"/>
    <path d="M 220,75 L 285,42 L 350,42 L 350,75 Z" fill="#38bdf8" opacity="0.4"/>
    <path d="M 360,42 L 445,42 L 495,75 L 360,75 Z" fill="#38bdf8" opacity="0.4"/>

    <!-- Headlights & Taillights -->
    <path d="M 40,140 Q 30,150 40,160 Z" fill="#ef4444" filter="url(#glow)"/>
    <path d="M 600,140 Q 610,150 600,160 Z" fill="#38bdf8" filter="url(#glow)"/>

    <!-- Sleek Body Line Accent -->
    <path d="M 60,135 Q 300,120 580,140" stroke="#60a5fa" stroke-width="3" fill="none" opacity="0.8"/>
  </g>

  <!-- Diagnostic Equipment Console Left -->
  <rect x="80" y="460" width="140" height="180" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <rect x="95" y="480" width="110" height="70" rx="6" fill="#020617"/>
  <!-- Display Graph -->
  <path d="M 105,530 L 125,510 L 140,525 L 160,495 L 180,515 L 195,500" stroke="#22c55e" stroke-width="3" fill="none"/>
  <circle cx="120" cy="580" r="8" fill="#3b82f6"/>
  <circle cx="150" cy="580" r="8" fill="#eab308"/>
  <circle cx="180" cy="580" r="8" fill="#ef4444"/>

  <!-- Mechanic Tool Chest Right -->
  <rect x="980" y="480" width="150" height="160" rx="8" fill="#dc2626" stroke="#991b1b" stroke-width="2"/>
  <line x1="990" y1="520" x2="1120" y2="520" stroke="#7f1d1d" stroke-width="4"/>
  <line x1="990" y1="550" x2="1120" y2="550" stroke="#7f1d1d" stroke-width="4"/>
  <line x1="990" y1="580" x2="1120" y2="580" stroke="#7f1d1d" stroke-width="4"/>
  <rect x="1040" y="500" width="30" height="8" rx="2" fill="#cbd5e1"/>
  <rect x="1040" y="530" width="30" height="8" rx="2" fill="#cbd5e1"/>
  <rect x="1040" y="560" width="30" height="8" rx="2" fill="#cbd5e1"/>

  <!-- Service Badge Overlay Top Right -->
  <g transform="translate(920, 60)">
    <rect width="220" height="70" rx="12" fill="#1e293b" opacity="0.9" stroke="#334155" stroke-width="2"/>
    <circle cx="40" cy="35" r="20" fill="#2563eb"/>
    <path d="M 32,35 L 38,41 L 48,29" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round"/>
    <text x="72" y="32" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">Service Center</text>
    <text x="72" y="50" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Verified Operations</text>
  </g>
</svg>
